<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>Get real-time weather information for any location</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Enter city name..." 
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <div class="quick-cities">
                <button class="quick-btn" data-city="London">London</button>
                <button class="quick-btn" data-city="New York">New York</button>
                <button class="quick-btn" data-city="Tokyo">Tokyo</button>
                <button class="quick-btn" data-city="Paris">Paris</button>
                <button class="quick-btn" data-city="Dubai">Dubai</button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <!-- Current Weather -->
        <section id="currentWeather" class="current-weather hidden">
            <div class="weather-card">
                <div class="weather-header">
                    <div class="location-info">
                        <h2 id="cityName"></h2>
                        <p id="currentDate"></p>
                    </div>
                    <div class="weather-icon-large">
                        <img id="weatherIcon" src="" alt="Weather icon">
                    </div>
                </div>

                <div class="weather-main">
                    <div class="temperature-section">
                        <div class="temp">
                            <span id="temperature"></span>
                            <span class="unit">°C</span>
                        </div>
                        <div class="weather-description">
                            <p id="weatherDesc"></p>
                            <p id="feelsLike"></p>
                        </div>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail">
                        <i class="fas fa-tint"></i>
                        <span>Humidity</span>
                        <strong id="humidity"></strong>
                    </div>
                    <div class="detail">
                        <i class="fas fa-wind"></i>
                        <span>Wind Speed</span>
                        <strong id="windSpeed"></strong>
                    </div>
                    <div class="detail">
                        <i class="fas fa-compress"></i>
                        <span>Pressure</span>
                        <strong id="pressure"></strong>
                    </div>
                    <div class="detail">
                        <i class="fas fa-eye"></i>
                        <span>Visibility</span>
                        <strong id="visibility"></strong>
                    </div>
                    <div class="detail">
                        <i class="fas fa-arrow-up"></i>
                        <span>UV Index</span>
                        <strong id="uvIndex"></strong>
                    </div>
                    <div class="detail">
                        <i class="fas fa-cloud"></i>
                        <span>Cloudiness</span>
                        <strong id="cloudiness"></strong>
                    </div>
                </div>
            </div>
        </section>

        <!-- 5-Day Forecast -->
        <section id="forecastSection" class="forecast-section hidden">
            <h3><i class="fas fa-calendar-alt"></i> 5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-container"></div>
        </section>

        <!-- Air Quality -->
        <section id="airQualitySection" class="air-quality-section hidden">
            <div class="air-quality-card">
                <h3><i class="fas fa-leaf"></i> Air Quality</h3>
                <div class="air-quality-info">
                    <div class="aqi-index">
                        <span id="aqiValue"></span>
                        <p id="aqiLevel"></p>
                    </div>
                    <div class="pollutants">
                        <div class="pollutant">
                            <span>PM2.5</span>
                            <strong id="pm25"></strong>
                        </div>
                        <div class="pollutant">
                            <span>PM10</span>
                            <strong id="pm10"></strong>
                        </div>
                        <div class="pollutant">
                            <span>NO₂</span>
                            <strong id="no2"></strong>
                        </div>
                        <div class="pollutant">
                            <span>O₃</span>
                            <strong id="o3"></strong>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Weather data provided by <strong>OpenWeatherMap API</strong></p>
            <p>Last updated: <span id="lastUpdate"></span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
